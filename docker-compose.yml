services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pingzap-mosquitto
    restart: unless-stopped
    # Gera o arquivo de senhas com os logins abaixo antes de iniciar o broker.
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      PINGZAP_MQTT_USERNAME: ${PINGZAP_MQTT_USERNAME:?defina PINGZAP_MQTT_USERNAME no .env}
      PINGZAP_MQTT_PASSWORD: ${PINGZAP_MQTT_PASSWORD:?defina PINGZAP_MQTT_PASSWORD no .env}
      ESP32_MQTT_USERNAME: ${ESP32_MQTT_USERNAME:?defina ESP32_MQTT_USERNAME no .env}
      ESP32_MQTT_PASSWORD: ${ESP32_MQTT_PASSWORD:?defina ESP32_MQTT_PASSWORD no .env}
    ports:
      # Exposta na rede local: o ESP32 conecta em <IP desta máquina>:1883.
      - "1883:1883"
    volumes:
      - ./mosquitto/init.sh:/init.sh:ro
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  pingzap:
    build: .
    image: pingzap
    container_name: pingzap
    restart: unless-stopped
    env_file: .env
    ports:
      # Interface web e API; o ESP32 busca as filas em http://<IP desta máquina>:<porta>.
      # A porta na máquina vem de PINGZAP_WEB_PORT no .env (padrão 8080).
      - "${PINGZAP_WEB_PORT:-8080}:8080"
    environment:
      # Sobrepõe o .env: dentro do container os bancos ficam sempre em /data.
      PINGZAP_WHATSAPP_DB: "file:/data/whatsapp.db?_foreign_keys=on"
      PINGZAP_DB: "file:/data/pingzap.db?_foreign_keys=on"
      PINGZAP_HTTP_ADDR: ":8080"
      # Sobrepõe o .env: usa o broker local do serviço mosquitto.
      PINGZAP_MQTT_BROKER: "tcp://mosquitto:1883"
      # Telemetria dos dispositivos, gravada no InfluxDB para o Grafana.
      PINGZAP_INFLUX_URL: "http://influxdb:8086"
      PINGZAP_INFLUX_TOKEN: ${INFLUXDB_TOKEN:?defina INFLUXDB_TOKEN no .env}
    depends_on:
      - mosquitto
      - influxdb
    volumes:
      # Sessão do WhatsApp e dados do pingzap (usuários, dispositivos, bots).
      - ./data:/data

  influxdb:
    image: influxdb:2.7.10
    container_name: pingzap-influxdb
    restart: unless-stopped
    environment:
      # Configuração inicial, aplicada só na primeira vez (volume vazio).
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?defina INFLUXDB_PASSWORD no .env}
      DOCKER_INFLUXDB_INIT_ORG: pingzap
      DOCKER_INFLUXDB_INIT_BUCKET: pingzap
      DOCKER_INFLUXDB_INIT_RETENTION: 90d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?defina INFLUXDB_TOKEN no .env}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:11.3.0
    container_name: pingzap-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?defina GRAFANA_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/pingzap.json
      # Lido pelo provisionamento do datasource (grafana/provisioning).
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?defina INFLUXDB_TOKEN no .env}
    depends_on:
      - influxdb
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  mosquitto-data:
  influxdb-data:
  grafana-data:
