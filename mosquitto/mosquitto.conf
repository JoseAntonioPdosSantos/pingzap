# Broker local usado pelo docker-compose.
# A porta 1883 fica exposta na rede local para o ESP32 e o MQTTX; o pingzap
# acessa pela rede interna do compose (tcp://mosquitto:1883).
listener 1883

# Só clientes com usuário e senha. O arquivo é gerado pelo init.sh a cada
# início do container, a partir das variáveis do .env.
allow_anonymous false
password_file /mosquitto/passwd

# Guarda as mensagens retidas (ex.: status online/offline do ESP32) entre
# reinícios do container.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
